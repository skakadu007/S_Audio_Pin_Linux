<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="meterGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="90%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#312e81" stroke-width="6"/>

  <!-- Subtle glow ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.4" filter="url(#glow)"/>

  <!-- Audio Waveform / VU Bars in background -->
  <g opacity="0.35" transform="translate(0, 20)">
    <rect x="110" y="220" width="16" height="72" rx="8" fill="url(#accentGrad)"/>
    <rect x="140" y="180" width="16" height="152" rx="8" fill="url(#accentGrad)"/>
    <rect x="170" y="240" width="16" height="32" rx="8" fill="url(#accentGrad)"/>
    <rect x="326" y="240" width="16" height="32" rx="8" fill="url(#accentGrad)"/>
    <rect x="356" y="180" width="16" height="152" rx="8" fill="url(#accentGrad)"/>
    <rect x="386" y="220" width="16" height="72" rx="8" fill="url(#accentGrad)"/>
  </g>

  <!-- Central Microphone with Modern Cyber Accent -->
  <g transform="translate(0, -10)">
    <!-- Mic capsule -->
    <rect x="216" y="110" width="80" height="144" rx="40" fill="url(#accentGrad)" filter="url(#glow)"/>
    <rect x="224" y="118" width="64" height="128" rx="32" fill="#0f172a"/>
    <!-- Mic grille lines -->
    <line x1="236" y1="150" x2="276" y2="150" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
    <line x1="236" y1="170" x2="276" y2="170" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
    <line x1="236" y1="190" x2="276" y2="190" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>

    <!-- Mic cradle arc -->
    <path d="M190 200 C 190 290, 322 290, 322 200" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round"/>
    <!-- Mic stand -->
    <line x1="256" y1="282" x2="256" y2="350" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round"/>
    <line x1="200" y1="350" x2="312" y2="350" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Live Record indicator dot with glow -->
  <circle cx="370" cy="140" r="22" fill="#f43f5e" filter="url(#glow)"/>
  <circle cx="370" cy="140" r="14" fill="#ffffff" opacity="0.9"/>
</svg>
