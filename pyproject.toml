[project]
name = "s-audio-pin-linux"
version = "0.1.0"
description = "Lightweight Linux Desktop Audio Process Monitor & Multi-Source Pinpoint Recorder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pulsectl>=24.12.0",
    "psutil>=7.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
