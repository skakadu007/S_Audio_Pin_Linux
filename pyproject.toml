[project]
name = "s-audio-pin-linux"
version = "0.2.1"
description = "Lightweight Linux Desktop Audio Process Monitor & Multi-Source Pinpoint Recorder"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pulsectl>=24.12.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "websockets>=13.0",
]

[project.scripts]
s-audio-pin = "s_audio_pin.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
s_audio_pin = ["ui/*.html", "ui/*.json", "ui/css/*", "ui/js/*", "ui/img/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
asyncio_mode = "auto"
